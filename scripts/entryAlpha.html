<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Enter Text</title>
    <link rel="stylesheet" href="entry.css">
</head>

<body data-layout="alpha">
    <div class="entryBox">
        <input class="entryValue" id="txtValue" autocomplete="off">
        <div class="entryKeys" id="keys"></div>
        <div class="entryFooter">
            <div class="entryBtn" id="btnCancel">Cancel</div>
            <div class="entrySpacer"></div>
            <div class="entryBtn entryBtnPrimary" id="btnOK">OK</div>
        </div>
    </div>
    <script src="entry.js"></script>
</body>

</html>
